name: Build and Release Velocity VPN

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Harness
        run: |
          flutter create . --platforms=android --org=com.velocity.vpn

      - name: Enable Core Library Desugaring
        run: |
          TARGET_GRADLE="android/app/build.gradle"
          if [ -f "$TARGET_GRADLE" ]; then
            # فعال‌سازی desugaring در compileOptions
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' "$TARGET_GRADLE"
            # افزودن کتابخانه desugar به dependencies
            sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' "$TARGET_GRADLE"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: |
          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            dart run flutter_launcher_icons || true
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Velocity VPN v1.0.2"
          body: "Official Release with Desugaring and Custom Icon"
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
