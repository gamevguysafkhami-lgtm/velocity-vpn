name: Build and Release Velocity VPN

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter Android
        run: |
          flutter config --enable-android
          flutter create . --platforms=android --org=com.velocity.vpn

      - name: Enable Core Library Desugaring
        run: |
          python3 -c "
          import os
          path = 'android/app/build.gradle'
          if os.path.exists(path):
              content = open(path, 'r').read()
              if 'coreLibraryDesugaringEnabled' not in content:
                  content = content.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              if 'coreLibraryDesugaring' not in content:
                  content = content.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"')
              open(path, 'w').write(content)
          kts_path = 'android/app/build.gradle.kts'
          if os.path.exists(kts_path):
              content = open(kts_path, 'r').read()
              if 'isCoreLibraryDesugaringEnabled' not in content:
                  content = content.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              if 'coreLibraryDesugaring' not in content:
                  content = content.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")')
              open(kts_path, 'w').write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Android APK
        run: flutter build apk --release

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Velocity VPN v1.0.2"
          body: "Official Release of Velocity VPN Android Client"
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
